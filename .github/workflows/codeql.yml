name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Android/Kotlin and JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, java-kotlin
      - name: Build Android project
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            cd android && ./gradlew --no-daemon :app:assembleDebug
          else
            echo "Gradle wrapper not present; CodeQL will use autobuild."
          fi
      - name: Autobuild if needed
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
