name: Build Android testing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/hardening-before-sale
    paths:
      - "android/**"
      - "english-with-family/**"
      - ".github/workflows/build-android-apk.yml"

# This workflow only builds and uploads a testing artifact; it does not publish releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare app web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R english-with-family/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Rename APK for testing
        run: cp android/app/build/outputs/apk/debug/app-debug.apk English-With-Family-debug-testing.apk
      - name: Upload APK testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-With-Family-debug-testing-apk
          path: English-With-Family-debug-testing.apk
          if-no-files-found: error
          retention-days: 14
