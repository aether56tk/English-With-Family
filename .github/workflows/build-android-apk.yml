name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "english-with-family/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare app web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R english-with-family/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-With-Family-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
