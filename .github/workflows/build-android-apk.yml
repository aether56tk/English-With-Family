name: Build and publish Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.*"
    paths:
      - "android/**"
      - "english-with-family/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare app web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R english-with-family/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk English-With-Family-${GITHUB_REF_NAME}-debug.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-With-Family-${{ github.ref_name }}-debug-apk
          path: English-With-Family-${{ github.ref_name }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release with APK
        if: startsWith(github.ref, 'refs/tags/v1.')
        uses: softprops/action-gh-release@v2
        with:
          name: English With Family ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: English-With-Family-${{ github.ref_name }}-debug.apk
          body: |
            English With Family Android APK release.

            - Includes the English With Family web lessons packaged in an Android app.
            - This is a debug-signed APK for testing, not a Play Store production release.
            - Speech recognition availability depends on the Android device and WebView.
